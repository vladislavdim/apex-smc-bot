name: Transfer verified knowledge pipeline changes
on:
  push:
    branches: [fix/knowledge-learning-pipeline-clean]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-learning-pipeline-clean
          fetch-depth: 0
      - name: Apply only verified source diffs
        run: |
          git fetch origin main fix/knowledge-learning-pipeline
          git diff origin/main..origin/fix/knowledge-learning-pipeline -- bot.py core/learning.py web_learner.py tests/test_knowledge_pipeline.py | git apply
      - name: Verify and protect tracked DB
        run: |
          python -m py_compile bot.py web_learner.py core/learning.py
          python -m unittest discover -s tests -v
          git diff --check
          git checkout origin/main -- brain.db
      - name: Commit clean scoped diff
        run: |
          rm -f .github/workflows/transfer-knowledge-pipeline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py core/learning.py web_learner.py tests/test_knowledge_pipeline.py .github/workflows/transfer-knowledge-pipeline.yml
          git commit -m "Refine APEX knowledge learning pipeline"
          git push origin HEAD:fix/knowledge-learning-pipeline-clean
