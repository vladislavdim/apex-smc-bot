name: Verify Strategy Funnel Cleanup

on:
  push:
    branches: [fix/strategy-funnel-cleanup]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'Apply strategy funnel cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-funnel-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply cleanup patch
        run: python .github/scripts/patch_strategy_funnel_cleanup_v2.py
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Strategy funnel regression
        run: python -m unittest tests.test_strategy_funnel_cleanup -v
      - name: Strategy tuning regression
        run: python -m unittest tests.test_strategy_tuning_trade_stats -v
      - name: Setup evidence regression
        run: python -m unittest tests.test_setup_evidence -v
      - name: Signal integrity and Groq gates
        run: python -m unittest tests.test_signal_integrity tests.test_signal_quality_gate tests.test_quality_gate_fail_closed -v
      - name: SWING and FAST regression
        run: python -m unittest tests.test_swing_ltf_entry_refinement tests.test_rr_floor_fast_balanced -v
      - name: Full tests
        run: python -m unittest discover -s tests -v
      - name: Verify invariants
        run: |
          git restore --source=HEAD -- brain.db || true
          git diff --check
          python - <<'PY'
          from pathlib import Path
          market = Path('market.py').read_text(encoding='utf-8')
          assert '4h BOS/CHoCH context after trigger (non-blocking)' in market
          assert "return _audit_fail('FAST_DETECT_FAST_DEAL_R9250'" not in market
          assert '_vol_threshold = 1.6' in market
          assert "'WYCKOFF_DIST_RANGE'" in market
          setup = Path('core/setup_evidence.py').read_text(encoding='utf-8')
          assert '4h plus fresh 1h BOS/CHoCH trigger' not in setup
          stats = Path('stats_server.py').read_text(encoding='utf-8')
          assert 'После последнего deploy' in stats
          assert 'wyckoff_dist_range' in stats
          PY
      - name: Commit verified runtime files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.py core/setup_evidence.py core/setup_audit.py core/strategy_catalog.py stats_server.py
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Apply strategy funnel cleanup'
            git push origin HEAD:fix/strategy-funnel-cleanup
          fi
