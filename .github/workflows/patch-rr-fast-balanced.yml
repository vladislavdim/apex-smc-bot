name: RR Floor and FAST Balanced

on:
  push:
    branches: [fix/rr-floor-fast-balanced]
    paths:
      - '.github/scripts/patch_rr_fast_balanced.py'
      - '.github/scripts/fix_rr_fast_test_assertions.py'
      - '.github/workflows/patch-rr-fast-balanced.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rr-floor-fast-balanced
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply targeted patch
        run: python .github/scripts/patch_rr_fast_balanced.py
      - name: Normalize regression assertions
        run: python .github/scripts/fix_rr_fast_test_assertions.py
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: RR FAST regression
        run: python -m unittest tests.test_rr_floor_fast_balanced -v
      - name: Signal integrity regression
        run: python -m unittest tests.test_signal_integrity -v
      - name: Setup evidence regression
        run: python -m unittest tests.test_setup_evidence -v
      - name: Strategy tuning regression
        run: python -m unittest tests.test_strategy_tuning_trade_stats -v
      - name: Full tests
        run: python -m unittest discover -s tests -v
      - name: Restore tracked DB and verify scope
        run: |
          git restore --source=HEAD -- brain.db || true
          git diff --check
          git diff --exit-code -- brain.db
          python - <<'PY'
          from pathlib import Path
          m=Path('market.py').read_text(encoding='utf-8')
          i=Path('core/signal_integrity.py').read_text(encoding='utf-8')
          e=Path('core/setup_evidence.py').read_text(encoding='utf-8')
          assert 'rr_check < 2.0 or rr_check > 4.0' not in m
          assert 'not 2.0 <= rr <= 4.0' not in m
          assert 'not 2.5 <= rr <= 4.0' not in m
          assert 'max_rr=4.0' not in m
          assert 'FAST: 1h or 4h supports 15m direction' in m
          assert 'FAST: recent 15m OB/FVG retest' in m
          assert 'min_rr = 2.0' in i
          assert 'RR is below the universal 2.0 minimum' in e
          print('RR/FAST invariants OK')
          PY
      - name: Commit verified implementation
        run: |
          git config user.name "APEX Strategy Fix"
          git config user.email "actions@users.noreply.github.com"
          git add market.py core/signal_integrity.py core/setup_evidence.py tests/test_rr_floor_fast_balanced.py
          git diff --cached --check
          git commit -m "Use universal RR floor and rebalance FAST context"
          git push origin HEAD:fix/rr-floor-fast-balanced
