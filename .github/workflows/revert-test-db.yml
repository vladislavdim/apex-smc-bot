name: Revert test DB artifact
on:
  push:
    branches: [fix/knowledge-learning-pipeline]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-learning-pipeline
          fetch-depth: 0
      - name: Restore tracked DB from main and remove helper
        run: |
          git fetch origin main
          git checkout origin/main -- brain.db
          rm -f .github/workflows/revert-test-db.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove test DB artifact"
          git push origin HEAD:fix/knowledge-learning-pipeline
