name: Run scoped strategy update
on:
  push:
    branches: [fix/strategy-core-rr-groq-rejections]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-core-rr-groq-rejections
          fetch-depth: 0
      - name: Apply market and Telegram wiring only
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once('market.py', '''        _sw_confirms = sum([
            _sw_vol_ok,         # Volume ≥1.2x
            _sw_disp_ok,        # Displacement ≥0.45
            _swing_1h_choch,    # CHoCH подтверждает
            _swing_pd_ok,       # Ликвидность/Premium-Discount
            _swing_fvg_ok,      # FVG между entry-TP
            _swing_15m_confirms,  # 15m импульс совпадает
        ])
        _sw_quality = f" [Q:{_sw_confirms}/6]"
        # Sweep, объём, displacement и CHoCH уже обязательны выше. Здесь
        # остаются ещё минимум три независимых подтверждения.
        if _sw_confirms < 3:
            logging.info(f"[SWING Quality] {symbol}: confirms={_sw_confirms}/6 < 3 — пропуск")
            return None
''', '''        # Fresh 1h structure is part of the SWING thesis, not a bonus vote.
        if not _swing_1h_choch:
            logging.info(f"[SWING Structure] {symbol}: no fresh 1h BOS/CHoCH after sweep — пропуск")
            return None

        _sw_confirms = sum([
            _sw_vol_ok,           # Volume ≥1.2x
            _sw_disp_ok,          # Displacement ≥0.45
            _swing_pd_ok,         # Premium/Discount context
            _swing_fvg_ok,        # FVG between entry and target
            _swing_15m_confirms,  # 15m impulse in trade direction
        ])
        _sw_quality = f" [Q:{_sw_confirms}/5]"
        if _sw_confirms < 2:
            logging.info(f"[SWING Quality] {symbol}: confirms={_sw_confirms}/5 < 2 — пропуск")
            return None
''')

          replace_once('market.py', '''            if _zone_structure_event:
                q_score += 1
                _zone_ltf_structure = True
''', '''            if _zone_structure_event:
                _zone_ltf_structure = True
''')

          replace_once('market.py', '''        # Q2: Объём последних 3 свечей > avg
        try:
            avg_vol = sum(c["volume"] for c in candles[-20:-1]) / 19
            if all(candles[-i]["volume"] > avg_vol for i in range(1, 4)):
                q_score += 1
        except Exception:
            pass

''', '''        # Volume is scored once below on the actual rejection candle.

''')

          replace_once('market.py', '''        # Адаптивный порог — при высокой волатильности достаточно 3
        _zone_ap = get_adaptive_params(symbol, candles)
        _zone_vf = _zone_ap.get("volatility_factor", 1.0) if _zone_ap else 1.0
        _q_min = 4 if _zone_vf > 1.2 else 5
        if q_score < _q_min:
            return None  # Недостаточно подтверждений
''', '''        # Structure is already mandatory above. Optional confirmations are
        # wick/RSI/FVG/BTC/funding/rejection-volume, without double-counting.
        _zone_ap = get_adaptive_params(symbol, candles)
        _zone_vf = _zone_ap.get("volatility_factor", 1.0) if _zone_ap else 1.0
        _q_min = 3
        if q_score < _q_min:
            return None  # Недостаточно независимых подтверждений
''')

          market = Path('market.py')
          text = market.read_text()
          if text.count('Quality score: {q_score}/8') != 1:
              raise SystemExit('ZONE quality denominator match count unexpected')
          text = text.replace('Quality score: {q_score}/8', 'Quality score: {q_score}/6', 1)
          swing_old = 'f"- RR < 2.0 или стоп > 4% (RR={rr}, стоп={_sw_sl_pct}%)'
          if text.count(swing_old) != 1:
              raise SystemExit('SWING RR prompt match count unexpected')
          text = text.replace(swing_old, 'f"- RR < 2.5 или стоп > 4% (RR={rr}, стоп={_sw_sl_pct}%)', 1)
          wy_old = '"- RR < 2.0 от текущей цены до целевой\\n"'
          wy_count = text.count(wy_old)
          if wy_count != 2:
              raise SystemExit(f'WYCKOFF RR prompt expected 2 matches, got {wy_count}')
          text = text.replace(wy_old, '"- RR < 2.5 от текущей цены до целевой\\n"')
          market.write_text(text)

          replace_once('bot.py', '''    fetch_strategy_stats as _fetch_strategy_stats,
    fetch_system_health as _fetch_system_health,
    fetch_watchlist as _fetch_watchlist,
    format_strategy_stats as _format_strategy_stats,
    format_watchlist as _format_watchlist,
''', '''    fetch_strategy_stats as _fetch_strategy_stats,
    fetch_system_health as _fetch_system_health,
    fetch_watchlist as _fetch_watchlist,
    fetch_groq_rejections as _fetch_groq_rejections,
    format_strategy_stats as _format_strategy_stats,
    format_watchlist as _format_watchlist,
    format_groq_rejections as _format_groq_rejections,
''')

          replace_once('bot.py', '''            reply_markup=InlineKeyboardMarkup(inline_keyboard=[
                [InlineKeyboardButton(text="🔄 Обновить", callback_data="menu_watchlist"),
                 InlineKeyboardButton(text="🔙 Меню", callback_data="menu_back")],
            ]),
        )

    elif data == "menu_scan":
''', '''            reply_markup=InlineKeyboardMarkup(inline_keyboard=[
                [InlineKeyboardButton(text="🚫 Отказы Groq", callback_data="menu_groq_rejections")],
                [InlineKeyboardButton(text="🔄 Обновить", callback_data="menu_watchlist"),
                 InlineKeyboardButton(text="🔙 Меню", callback_data="menu_back")],
            ]),
        )

    elif data == "menu_groq_rejections":
        try:
            rejection_data = await asyncio.to_thread(_fetch_groq_rejections, DB_PATH, 24, 30)
            text = _format_groq_rejections(rejection_data)
        except Exception as exc:
            logging.error("Telegram Groq rejection view: %s", exc)
            text = "⚠️ Не удалось прочитать журнал отказов Groq. Сканер продолжает работать."
        await callback.message.edit_text(
            text,
            parse_mode="HTML",
            reply_markup=InlineKeyboardMarkup(inline_keyboard=[
                [InlineKeyboardButton(text="🔄 Обновить", callback_data="menu_groq_rejections"),
                 InlineKeyboardButton(text="👀 Наблюдаемые", callback_data="menu_watchlist")],
                [InlineKeyboardButton(text="🔙 Меню", callback_data="menu_back")],
            ]),
        )

    elif data == "menu_scan":
''')
          PY
      - name: Verify syntax tests and diff
        run: |
          python -m py_compile bot.py market.py core/signal_integrity.py core/telegram_dashboard.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py market.py
          git commit -m "Refine SWING ZONE and Groq rejection view"
          git push origin HEAD:fix/strategy-core-rr-groq-rejections
