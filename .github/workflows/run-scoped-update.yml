name: Run scoped strategy update
on:
  push:
    branches: [fix/strategy-core-rr-groq-rejections]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-core-rr-groq-rejections
          fetch-depth: 0
      - name: Apply scoped patch
        run: python scripts/apply_scoped_strategy_update.py
      - name: Verify syntax tests and diff
        run: |
          python -m py_compile bot.py market.py core/signal_integrity.py core/telegram_dashboard.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit verified market and Telegram changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py market.py
          git commit -m "Refine SWING ZONE and Groq rejection view"
          git push origin HEAD:fix/strategy-core-rr-groq-rejections
