name: Apply WYCKOFF structural box gate

on:
  push:
    branches:
      - fix/wyckoff-structural-box-gate
    paths:
      - .github/workflows/apply-wyckoff-structural-box-gate.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wyckoff-structural-box-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/apply_wyckoff_structural_box_gate.py
      - name: Remove temporary helper and workflow
        run: |
          rm .github/scripts/apply_wyckoff_structural_box_gate.py
          rm .github/workflows/apply-wyckoff-structural-box-gate.yml
      - name: Compile
        run: python -m compileall -q market.py bot.py stats_server.py core tests
      - name: Focused regression tests
        run: |
          python -m unittest -v tests.test_wyckoff_structural_box_gate
          python -m unittest -v tests.test_numeric_diagnostics_and_mtf_throughput
          python -m unittest -v tests.test_observability_telemetry_only
          python -m unittest -v tests.test_strategy_lab_terminal_truth
      - name: Full test suite
        run: python -m unittest discover -s tests -v
      - name: Restore mutable DB artifacts
        if: always()
        run: |
          git checkout -- brain.db 2>/dev/null || true
          rm -f setup_audit.db setup_audit.db-shm setup_audit.db-wal
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git status --porcelain)" && exit 1
          git commit -m "Use structural WYCKOFF distribution box for width gate"
          git push origin HEAD:fix/wyckoff-structural-box-gate
