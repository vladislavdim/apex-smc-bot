name: Apply knowledge learning pipeline update
on:
  push:
    branches: [fix/knowledge-learning-pipeline]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-learning-pipeline
          fetch-depth: 0
      - name: Apply scoped knowledge changes
        run: python scripts/apply_knowledge_pipeline_update.py
      - name: Verify syntax and tests
        run: |
          python -m py_compile bot.py web_learner.py core/learning.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit verified changes and cleanup helpers
        run: |
          rm -f scripts/apply_knowledge_pipeline_update.py .github/workflows/apply-knowledge-pipeline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refine APEX knowledge learning pipeline"
          git push origin HEAD:fix/knowledge-learning-pipeline
