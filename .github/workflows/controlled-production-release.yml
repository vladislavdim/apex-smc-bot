name: APEX Controlled Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_APEX_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apex-production-release
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirmation == 'DEPLOY_APEX_PRODUCTION'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify immutable main commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test "$SHA" = "${{ inputs.release_sha }}"
          git fetch --filter=blob:none --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main
          echo "release_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Full release verification
        run: |
          set -euo pipefail
          python scripts/verify_v3_completion.py --release-ready
          python scripts/verify_production_authority.py
          python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python -m ruff check . --select F821,F822,F823
          python -m pip_audit -r requirements.txt
          python -m pytest -q
          python -m unittest discover -s tests -q
          TELEGRAM_TOKEN=123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            python scripts/run_strategy_parity_corpus.py \
              --output /tmp/apex-v3-release-verdict.json
          cmp /tmp/apex-v3-release-verdict.json \
            tests/fixtures/apex_v3_strategy_parity_verdict.json
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      APEX_RELEASE_CONFIRMATION: DEPLOY_APEX_PRODUCTION
    steps:
      - name: Checkout verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install release dependency
        run: pip install requests

      - name: Deploy Telegram-only worker and verify shared ownership
        run: >-
          python scripts/render_telegram_release.py
          --sha "${{ needs.verify.outputs.release_sha }}"
          --retire-dashboard
