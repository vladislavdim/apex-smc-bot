name: APEX AI Auto-Fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      error_log:
        description: 'Вставь текст ошибки из Render'
        required: true
        type: string
  push:
    branches: [main]
    paths-ignore:
      - 'brain.db'
      - '*.db'

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compile project
        run: python3 -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  ai-fix:
    # AI mutation is an explicit manual recovery action, never a side effect of push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check syntax
        id: syntax
        run: |
          if python3 -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' . 2>/tmp/err.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix syntax error
        if: steps.syntax.outputs.ok == 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 .github/scripts/fix_syntax.py

      - name: Fix from error log
        if: github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ERROR_LOG: ${{ github.event.inputs.error_log }}
        run: python3 .github/scripts/fix_error.py

      - name: Verify
        run: |
          python3 -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
          python3 -m unittest discover -s tests -v

      - name: Commit fix
        run: |
          git config user.name "APEX AI"
          git config user.email "apex@bot.ai"
          git add bot.py
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "AI fix $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi
