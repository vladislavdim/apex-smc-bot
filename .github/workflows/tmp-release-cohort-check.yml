name: temporary release cohort check

on:
  push:
    branches: [strategy-lab-release-cohorts]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile core/runtime_observability.py core/runtime_observability_overrides.py core/__init__.py tests/test_release_cohort_observability.py
      - name: Focused tests
        run: python -m unittest -v tests.test_release_cohort_observability
