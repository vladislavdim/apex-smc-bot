name: Install Strategy Stats Dashboard

on:
  push:
    branches:
      - feature/strategy-stats-dashboard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/strategy-stats-dashboard
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current dependencies
        run: pip install -r requirements.txt
      - name: Apply passive stats instrumentation
        run: python scripts/install_strategy_stats.py
      - name: Install updated dependencies
        run: pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q .
      - name: Run full test suite
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "APEX Stats Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add integrated strategy statistics dashboard"
          git push origin HEAD:feature/strategy-stats-dashboard
