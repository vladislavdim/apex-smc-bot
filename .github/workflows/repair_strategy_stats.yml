name: Repair Strategy Stats Instrumentation

on:
  push:
    branches:
      - feature/strategy-stats-dashboard

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/strategy-stats-dashboard
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore tracked production database
        run: git checkout origin/main -- brain.db
      - name: Repair observability-only predicates and compare semantic AST
        run: python scripts/repair_strategy_stats.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q .
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Verify audit predicates are real blocking predicates
        run: |
          python - <<'PY'
          import ast
          for path in ('market.py','bot.py'):
              tree=ast.parse(open(path,encoding='utf-8').read())
              for node in ast.walk(tree):
                  if not isinstance(node,ast.If):
                      continue
                  t=node.test
                  if not (isinstance(t,ast.Call) and isinstance(t.func,ast.Name) and t.func.id=='_audit_test'):
                      continue
                  direct=any(isinstance(s,ast.Return) and isinstance(s.value,ast.Call) and isinstance(s.value.func,ast.Name) and s.value.func.id=='_audit_fail' for s in node.body)
                  assert direct, f'{path}:{node.lineno} audit predicate is not a direct blocking gate'
          print('audit predicate structure OK')
          PY
      - name: Check diff and commit
        run: |
          git diff --check
          git config user.name "APEX Stats Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Verify stats instrumentation preserves trading semantics"
          git push origin HEAD:feature/strategy-stats-dashboard
