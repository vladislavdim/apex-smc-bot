name: APEX Prepare Controlled Release

on:
  push:
    branches:
      - codex/btc-github-research

permissions:
  contents: read

concurrency:
  group: apex-production-release
  cancel-in-progress: false

jobs:
  disable-commit-deploys:
    if: github.repository == 'vladislavdim/apex-smc-bot'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      APEX_RELEASE_CONFIRMATION: DEPLOY_APEX_PRODUCTION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify exact services and disable commit deploys
        run: python scripts/render_controlled_release.py --sha "${{ github.sha }}" --disable-only
