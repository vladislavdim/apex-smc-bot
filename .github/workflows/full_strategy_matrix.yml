name: Full Strategy Matrix
on:
  push:
    branches:
      - feature/full-strategy-matrix
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-strategy-matrix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/patch_full_strategy_matrix.py
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p 'test*.py'
      - run: |
          python -c "from pathlib import Path; s=Path('stats_server.py').read_text(); assert '[MAIN]' in s and '[ADD]' in s and 'NOT_REACHED' in s and 'Проходимость критериев' in s"
      - run: |
          rm -f tools/patch_full_strategy_matrix.py .github/workflows/full_strategy_matrix.yml
          git checkout main -- brain.db || true
          git config user.name "APEX Dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "Show complete strategy criteria matrix"
          git push origin HEAD:feature/full-strategy-matrix
