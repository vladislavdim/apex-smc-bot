name: Apply diagnostics telemetry patch

on:
  push:
    branches:
      - diagnostics/mtf-throughput-numeric-telemetry
    paths:
      - .github/scripts/apply_diagnostics_telemetry.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/mtf-throughput-numeric-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply patch
        run: python .github/scripts/apply_diagnostics_telemetry.py
      - name: Remove temporary helpers
        run: rm -f .github/scripts/apply_diagnostics_telemetry.py .github/workflows/apply-diagnostics-telemetry.yml
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Focused tests
        run: |
          python -m unittest -v tests.test_numeric_diagnostics_and_mtf_throughput
          python -m unittest -v tests.test_rr_floor_fast_balanced
          python -m unittest -v tests.test_observability_telemetry_only
          python -m unittest -v tests.test_strategy_funnel_cleanup
      - name: Full test suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MTF scan throughput and add numeric funnel telemetry'
          git push origin HEAD:diagnostics/mtf-throughput-numeric-telemetry
