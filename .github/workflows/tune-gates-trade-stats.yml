name: Tune Strategy Gates and Trade Stats

on:
  push:
    branches: [feature/tune-strategy-gates-trade-stats]
    paths:
      - '.github/workflows/tune-gates-trade-stats.yml'
      - '.github/scripts/tune_gates_trade_stats.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tune-strategy-gates-trade-stats
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply conservative tuning and dashboard telemetry patch
        run: python .github/scripts/tune_gates_trade_stats.py
      - name: Compile project
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Run full tests
        run: python -m unittest discover -s tests -v
      - name: Verify scope and tracked DB safety
        run: |
          git diff --check
          git diff --exit-code -- brain.db
          python - <<'PY'
          from pathlib import Path
          m=Path('market.py').read_text(encoding='utf-8')
          s=Path('stats_server.py').read_text(encoding='utf-8')
          assert 'lookback=7' in m
          assert 'len(candles) < 40' in m
          assert '_vol_threshold = 1.6' in m
          assert 'trade_event' in m
          assert 'trade_stats' in s
          assert 'Статистика сделок' in s
          print('scope verifier: OK')
          PY
      - name: Commit verified patch
        run: |
          git config user.name "APEX Tuning"
          git config user.email "actions@users.noreply.github.com"
          git add market.py stats_server.py tests/test_strategy_tuning_trade_stats.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Tune strategy gates and add trade performance stats"
            git push origin HEAD:feature/tune-strategy-gates-trade-stats
          fi
