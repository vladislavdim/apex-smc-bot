name: Clean Strategy Stats Branch

on:
  push:
    branches:
      - feature/strategy-stats-dashboard

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/strategy-stats-dashboard
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore production database before tests
        run: git checkout origin/main -- brain.db
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q .
      - name: Run full tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Restore production database after tests
        run: git checkout origin/main -- brain.db
      - name: Verify database is unchanged
        run: git diff --exit-code origin/main -- brain.db
      - name: Check and commit cleanup
        run: |
          git diff --check
          rm .github/workflows/cleanup_strategy_stats.yml
          git config user.name "APEX Stats Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove transient stats branch artifacts"
          git push origin HEAD:feature/strategy-stats-dashboard
