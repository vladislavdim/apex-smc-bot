name: Richer Setup Details
on:
  push:
    branches:
      - feature/richer-setup-details
permissions:
  contents: write
jobs:
  patch_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/richer-setup-details
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/patch_dashboard.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Verify dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('stats_server.py').read_text(encoding='utf-8')
          assert 'Где чаще всего останавливаются' in s
          assert 'Проходимость критериев' in s
          assert 'Критерии стратегии</h2><div id=catalog' not in s
          assert 'function detailText(r)' in s
          assert '[GROQ]' in s and '[STOP]' in s and '[LEVELS]' in s
          print('dashboard detail requirements OK')
          PY
      - name: Commit verified change
        run: |
          rm -f .github/workflows/richer_setup_details.yml .github/scripts/patch_dashboard.py
          git config user.name "APEX Dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "Improve setup detail readability"
          git push origin HEAD:feature/richer-setup-details
