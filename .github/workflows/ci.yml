name: APEX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '*.db'

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-diagnostics:
    # Read-only incident investigation, scoped to this owner-authored repair.
    # No deploy, env mutation, secret export or exchange operation is performed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/runtime-accounting-recovery-20261009' && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests psycopg2-binary
      - name: Read bounded redacted logs for the two verified services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          APEX_RELEASE_CONFIRMATION: DEPLOY_APEX_PRODUCTION
        run: python scripts/render_controlled_release.py --sha "${{ github.sha }}" --diagnostics-only
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Compile project
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .

      - name: Full test suite
        run: |
          python -m pytest -q
          python -m unittest discover -s tests -q

      - name: Verify workflow syntax and production authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          python scripts/verify_production_authority.py
          python scripts/verify_v3_completion.py --release-ready
          TELEGRAM_TOKEN=123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            python scripts/run_strategy_parity_corpus.py \
              --output /tmp/apex-v3-ci-verdict.json
          cmp /tmp/apex-v3-ci-verdict.json \
            tests/fixtures/apex_v3_strategy_parity_verdict.json

      - name: Diff integrity
        run: git diff --check
