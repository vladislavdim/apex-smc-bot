name: APEX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '*.db'

permissions:
  contents: read

concurrency:
  group: apex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Compile project
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .

      - name: Full test suite
        run: |
          python -m pytest -q
          python -m unittest discover -s tests -q

      - name: Verify workflow syntax and production authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          python scripts/verify_production_authority.py
          python scripts/verify_v3_completion.py --release-ready
          TELEGRAM_TOKEN=123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            python scripts/run_strategy_parity_corpus.py \
              --output /tmp/apex-v3-ci-verdict.json
          cmp /tmp/apex-v3-ci-verdict.json \
            tests/fixtures/apex_v3_strategy_parity_verdict.json

      - name: Diff integrity
        run: git diff --check
