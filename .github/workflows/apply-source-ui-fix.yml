name: Apply source and UI fix
on:
  push:
    branches: [fix/knowledge-sources-ui]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-sources-ui
          fetch-depth: 0
      - name: Apply scoped fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path('bot.py')
          text = bot.read_text()
          old = '''            f"🕐 Последний WebLearner: <b>{last_web or '—'}</b>\\n"\n            f"🎓 Последнее обучение по сделке: <b>{last_trade_learning or '—'}</b>\\n"\n            f"{execution_block}{macro_block}\\n"\n            f"<i>Обновление автоматическое: результаты сделок, новости и "\n            f"веб-контекст сохраняются в brain.db. Groq использует этот "\n            f"контекст, но не переобучает свои базовые веса.</i>",'''
          new = '''            f"🕐 Последний WebLearner: <b>{last_web or '—'}</b>\\n"\n            f"🎓 Последнее обучение по сделке: <b>{last_trade_learning or '—'}</b>\\n"\n            f"{execution_block}",'''
          if old not in text:
              raise SystemExit('bot UI block not found')
          bot.write_text(text.replace(old, new, 1))

          wl = Path('web_learner.py')
          text = wl.read_text()
          marker = '''RSS_SOURCES = {\n'''
          default_block = '''DEFAULT_LEARNING_SOURCES = (\n    # Fresh market/news context\n    "CoinDesk", "TheBlock", "Decrypt",\n    # Research / on-chain / fundamental context\n    "Glassnode_blog", "Messari", "IntoTheBlock", "CryptoQuant_blog", "DeFiLlama_news",\n)\n\n'''
          insert_at = text.index('# Конкретные темы для изучения из источников топ трейдеров')
          if 'DEFAULT_LEARNING_SOURCES = (' not in text:
              text = text[:insert_at] + default_block + text[insert_at:]
          old_select = '''    # Выбираем источники по категории\n    sources_to_use = dict(list(RSS_SOURCES.items())[:8])  # топ-8 по умолчанию\n'''
          new_select = '''    # Балансируем новости и исследовательские/on-chain источники.\n    # Раньше использовались просто первые 8 элементов словаря — почти только новостные сайты.\n    selected_names = [name for name in DEFAULT_LEARNING_SOURCES if name in RSS_SOURCES]\n    sources_to_use = {name: RSS_SOURCES[name] for name in selected_names}\n'''
          if old_select not in text:
              raise SystemExit('web learner source selector not found')
          wl.write_text(text.replace(old_select, new_select, 1))

          test = Path('tests/test_knowledge_pipeline.py')
          text = test.read_text()
          needle = '''    def test_polling_mode_schedules_web_learning(self):\n'''
          addition = '''    def test_default_web_learning_sources_are_balanced(self):\n        text = Path('web_learner.py').read_text()\n        self.assertIn('DEFAULT_LEARNING_SOURCES = (', text)\n        for name in ('CoinDesk', 'TheBlock', 'Decrypt', 'Glassnode_blog', 'Messari', 'IntoTheBlock', 'CryptoQuant_blog', 'DeFiLlama_news'):\n            self.assertIn(f'"{name}"', text)\n        self.assertNotIn('dict(list(RSS_SOURCES.items())[:8])', text)\n\n    def test_brain_screen_hides_macro_summary_but_keeps_learning_status(self):\n        text = Path('bot.py').read_text()\n        block = text[text.index('elif data == "menu_brain"'):text.index('elif data == "brain_sources"')]\n        self.assertNotIn('{macro_block}', block)\n        self.assertIn('Последний WebLearner', block)\n        self.assertIn('{execution_block}', block)\n\n'''
          if addition not in text:
              text = text.replace(needle, addition + needle, 1)
          test.write_text(text)
          PY
      - name: Verify
        run: |
          python -m py_compile bot.py web_learner.py core/learning.py
          python -m unittest discover -s tests -v
          git diff --check
          git checkout origin/main -- brain.db
      - name: Commit and cleanup helper
        run: |
          rm -f .github/workflows/apply-source-ui-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py web_learner.py tests/test_knowledge_pipeline.py .github/workflows/apply-source-ui-fix.yml
          git commit -m "Balance learning sources and simplify brain UI"
          git push origin HEAD:fix/knowledge-sources-ui
